<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sn-games</title>

  <link rel="icon" type="image/png" href="/src/favicon/favicon-96x96.png?v=big-meat" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/src/favicon/favicon.svg?v=big-meat" />
  <link rel="shortcut icon" href="/src/favicon/favicon.ico?v=big-meat" />
  <link rel="apple-touch-icon" sizes="180x180" href="/src/favicon/apple-touch-icon.png?v=big-meat" />
  <meta name="apple-mobile-web-app-title" content="Games" />
  <link rel="manifest" href="/src/favicon/sn-games.webmanifest?v=big-meat" />
</head>

<body>
  <div id="logo">sn-games</div>
  <!--  -->
  <!--  -->
  <div id="player">
    <div id="player-controls" class="ui">
      <div id="player-title">Example Game</div>
      <div id="player-fullscreen" class="ui"></div>
      <div id="player-close" class="ui"></div>
    </div>
    <iframe id="player-frame" title="game frame" allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-forms"></iframe></iframe>

  </div>
  <!--  -->
  <!--  -->
  <div id="gallery"></div>
  <!--  -->
  <!--  -->
  <div id="toolbar">
    <input id="toolbar-search" contenteditable="plaintext-only" aria-label="search" placeholder="search...">
    <div id="toolbar-settings" class="ui"></div>
  </div>
  <!--  -->
  <!--  -->
  <div id="settings">
    <div id="settings-background">
      <div id="settings-title">Settings</div>
    </div>
  </div>
  <!--  -->
  <!--  -->
  <script type="module" src="/src/main.js"></script>
</body>

</html>
