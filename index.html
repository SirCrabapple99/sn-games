<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sn-games</title>

  <link rel="icon" type="image/png" href="/src/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/src/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/src/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/src/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Games" />
  <link rel="manifest" href="/src/favicon/sn-games.webmanifest" />
</head>

<body>
  <div id="logo">sn-games</div>
  <div id="gradient-top"></div>
  <div id="gradient-bottom"></div>
  <!--  -->
  <!--  -->
  <div id="player">
    <div id="player-controls" class="ui">
      <div id="player-title">Example Game</div>
      <div id="player-savedata" class="ui"></div>
      <div id="player-fullscreen" class="ui"></div>
      <div id="player-close" class="ui"></div>
    </div>
    <iframe id="player-frame" title="game frame" allow="fullscreen; autoplay; gamepad; cross-origin-isolated"
      sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock"></iframe>
  </div>

  <div id="savedata">
    <div id="savedata-background">
      <div id="savedata-header">
        <div id="savedata-title">Save Data</div>
        <div id="savedata-close" class="ui uioverride"
          onclick="document.getElementById('savedata').classList.toggle('visible'); document.documentElement.style.setProperty('--ui-thing-visiblity', 1);">
        </div>
      </div>
      <div id="savedata-controls">
        <div id="savedata-download" class="ui">Upload Data</div>
        <div id="savedata-upload" class="ui">Download Data</div>
      </div>
    </div>
  </div>

  <!--  -->
  <!--  -->
  <div id="gallery"></div>
  <!--  -->
  <!--  -->
  <div id="toolbar">
    <input id="toolbar-search" contenteditable="plaintext-only" aria-label="search" placeholder="search...">
    <div id="toolbar-settings" class="ui"></div>
  </div>
  <!--  -->
  <!--  -->
  <div id="settings">
    <div id="settings-background">
      <div id="settings-header">
        <div id="settings-title">Settings</div>
        <div id="settings-close" class="ui uioverride"
          onclick="document.getElementById('settings').classList.toggle('visible'); document.documentElement.style.setProperty('--ui-thing-visiblity', 1);">
        </div>
      </div>
      <div id="settings-sources">Sources</div>
      <div id="settings-colorpicker">Site Color</div>
      <input type="color" id="settings-colorpicker-real" style="visibility: collapse;">
    </div>
  </div>
  <!--  -->
  <!--  -->
  <script type="module" src="/src/main.js"></script>
</body>

</html>
