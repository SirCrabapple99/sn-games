<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sn-games</title>
</head>

<body>
  <div id="logo">sn-games</div>
  <!--  -->
  <!--  -->
  <div id="player">
    <div id="player-controls" class="ui">
      <div id="player-title">Example Game</div>
      <div id="player-fullscreen" class="ui"></div>
      <div id="player-close" class="ui"></div>
    </div>
    <iframe id="player-frame" title="game frame" allow="fullscreen"
      sandbox="allow-scripts allow-same-origin allow-forms"></iframe></iframe>

  </div>
  <!--  -->
  <!--  -->
  <div id="gallery"></div>
  <!--  -->
  <!--  -->
  <div id="toolbar">
    <input id="toolbar-search" contenteditable="plaintext-only" aria-label="search" placeholder="search...">
    <div id="toolbar-settings" class="ui"></div>
  </div>
  <!--  -->
  <!--  -->
  <div id="settings">
    <div id="settings-background">
      <div id="settings-header">
        <div id="settings-title">Settings</div>
        <div id="settings-close" class="ui" onclick="document.getElementById('settings').classList.toggle('visible')">
        </div>
      </div>
      <div id="settings-sources">Sources</div>
    </div>
  </div>
  <!--  -->
  <!--  -->
  <script type="module" src="/src/main.js"></script>
</body>

</html>
